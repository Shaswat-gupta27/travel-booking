spring:
  profiles:
    active: dev
  application:
    name: flight

  main:
    allow-circular-references: false

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/flight_write
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    entity-packages-to-scan: io.bookingmicroservices.flight
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: legacy
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties.hibernate.format_sql: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/flight_read
      database: flight_read

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    template:
      exchange: flight
      exchange-type: fanout

  otel:
    collector:
      service-name: flight
      service-version: 1.0.0
      endpoint: http://localhost:4317

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/keycloak-realm/protocol/openid-connect/certs

app:
  security:
    # GET requests that need no login; keep in sync with the gateway
    public-get-paths: "/api/*/flight,/api/*/flight/{id:[0-9a-fA-F-]{36}},/api/*/flight/get-available-seats/*,/api/*/flight/search,/api/*/flight/airport,/api/*/flight/airport/{id:[0-9a-fA-F-]{36}},/api/*/flight/aircraft,/api/*/flight/aircraft/{id:[0-9a-fA-F-]{36}}"
